name: Release

# v2.2.0 publishes the backend, frontend and gateway images and the signed
# POS APK as one release. v2.2.0-rc.1 publishes a test build without moving
# latest.
on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      code: ${{ steps.meta.outputs.code }}
    steps:
      - name: Resolve version
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-rc\.([0-9]+))?$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' is not v<x.y.z> or v<x.y.z>-rc.<n>" >&2
            exit 1
          fi
          m=("${BASH_REMATCH[@]}")
          # Android versionCode: 2.2.0-rc.1 is 2020001, 2.2.0 is 2020099
          code=$(( m[1] * 1000000 + m[2] * 10000 + m[3] * 100 + ${m[5]:-99} ))
          {
            echo "version=${version}"
            echo "code=${code}"
          } >> "$GITHUB_OUTPUT"

  backend-checks:
    name: Backend checks
    permissions:
      contents: read
    uses: ./.github/workflows/backend-ci.yml # zizmor: ignore[self-repository]

  web-checks:
    name: Web checks
    permissions:
      contents: read
    uses: ./.github/workflows/web-ci.yml # zizmor: ignore[self-repository]

  pos-checks:
    name: POS checks
    permissions:
      contents: read
    uses: ./.github/workflows/pos-ci.yml # zizmor: ignore[self-repository]

  image:
    name: Publish ${{ matrix.component }} image
    # Waits for the APK so a failed signing publishes nothing
    needs: [version, backend-checks, web-checks, apk-sign]
    strategy:
      matrix:
        component: [backend, frontend, gateway]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image tags
        id: meta
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/monero-merchant-${COMPONENT}"
          tags="${image}:${VERSION}"
          if [[ "$VERSION" != *-* ]]; then
            tags="${tags},${image}:${VERSION%%.*},${image}:latest"
          fi
          {
            echo "version=${VERSION}"
            echo "image=${image}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Only the backend uses it, for the version it logs at startup
          build-args: ${{ matrix.component == 'backend' && format('VERSION={0}', steps.meta.outputs.version) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published ${IMAGE}"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Tags: \`${TAGS}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo
            echo "Pinned reference:"
            echo
            echo "\`${IMAGE}:${VERSION}@${DIGEST}\`"
            echo
            echo "Verify: \`gh attestation verify oci://${IMAGE}@${DIGEST} --owner ${GITHUB_REPOSITORY_OWNER}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir notes
          echo "| ${IMAGE##*/} | \`${IMAGE}:${VERSION}@${DIGEST}\` |" > "notes/image-${IMAGE##*/}.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes-${{ matrix.component }}
          path: notes/
          if-no-files-found: error
          retention-days: 1

  apk-build:
    name: Build POS APK
    needs: [version, pos-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Build unsigned APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
        run: ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pos-apk-unsigned
          path: pos/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  # Separate job so no build code runs next to the key
  apk-sign:
    name: Sign POS APK
    needs: [version, apk-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only v* tags can deploy to this environment
    environment: release
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pos-apk-unsigned

      - name: Sign APK
        env:
          POS_KEYSTORE_BASE64: ${{ secrets.POS_KEYSTORE_BASE64 }}
          POS_KEYSTORE_PASSWORD: ${{ secrets.POS_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          base64 -d <<< "$POS_KEYSTORE_BASE64" > "$RUNNER_TEMP/pos.p12"
          apksigner=$(printf "%s\n" "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" sign --ks "$RUNNER_TEMP/pos.p12" --ks-key-alias pos --ks-pass env:POS_KEYSTORE_PASSWORD \
            --out "monero-merchant-pos-${VERSION}.apk" app-release-unsigned.apk
          rm "$RUNNER_TEMP/pos.p12"
          {
            echo "### Signed monero-merchant-pos-${VERSION}.apk"
            echo
            echo '```'
            "$apksigner" verify --verbose --print-certs "monero-merchant-pos-${VERSION}.apk"
            echo '```'
            echo
            echo "Verify: \`gh attestation verify monero-merchant-pos-${VERSION}.apk --owner ${GITHUB_REPOSITORY_OWNER}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cert=$("$apksigner" verify --print-certs "monero-merchant-pos-${VERSION}.apk" | awk '/certificate SHA-256 digest/ { print toupper($NF); exit }' | sed 's/../&:/g; s/:$//')
          mkdir notes
          {
            echo "## POS app"
            echo
            echo "\`monero-merchant-pos-${VERSION}.apk\`, signing certificate SHA-256:"
            echo
            echo "\`${cert}\`"
          } > notes/pos.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: monero-merchant-pos-*.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pos-apk
          path: monero-merchant-pos-*.apk
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes-pos
          path: notes/
          if-no-files-found: error
          retention-days: 1

  github-release:
    name: Create GitHub release
    needs: [version, image, apk-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pos-apk

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: notes-*
          path: notes
          merge-multiple: true

      - name: Prepare install files and notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Point at this repo's images, so a fork's release installs the fork's build
          sed -Ei "s#ghcr.io/monero-merchant/(monero-merchant-(backend|frontend|gateway):)#ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/\1#" docker-compose.yml
          # Stable installs follow the major version, rc installs stay on the rc
          pin="${VERSION%%.*}"
          if [[ "$VERSION" == *-* ]]; then
            pin="$VERSION"
          fi
          sed -i "s|^MONERO_MERCHANT_VERSION=.*|MONERO_MERCHANT_VERSION=${pin}|" example.env
          {
            echo "## Images"
            echo
            echo "| Image | Reference |"
            echo "|---|---|"
            cat notes/image-*.md
            echo
            echo "Verify with \`gh attestation verify oci://<reference> --owner ${GITHUB_REPOSITORY_OWNER}\`."
            echo
            cat notes/pos.md
          } > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --notes-file release-notes.md --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          else
            # Stable notes start at the previous stable release, not the last rc
            prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
            if [[ -n "$prev" ]]; then
              flags+=(--notes-start-tag "$prev")
            fi
          fi
          gh release create "$GITHUB_REF_NAME" monero-merchant-pos-*.apk docker-compose.yml example.env setup.sh --repo "$GITHUB_REPOSITORY" "${flags[@]}"
