services:
  # ------------------------
  # MoneroPay wallet dir permissions
  # ------------------------
  change-vol-ownership:
    image: alpine
    command: "chown -R ${CURRENT_UID}: /mnt/wallet"
    volumes:
      - ./moneropay/data/wallet:/mnt/wallet

  # ------------------------
  # MoneroPay wallet RPC
  # ------------------------
  monero-wallet-rpc:
    image: ghcr.io/monero-merchant/monero-merchant-wallet-rpc:0.18.5.4-1
    environment:
      MONERO_WALLET_RPC_USERNAME: ${MONERO_WALLET_RPC_USERNAME:?run ./setup.sh to generate wallet RPC credentials}
      MONERO_WALLET_RPC_PASSWORD: ${MONERO_WALLET_RPC_PASSWORD:?run ./setup.sh to generate wallet RPC credentials}
      MONERO_DAEMON_RPC_USERNAME: ${MONERO_DAEMON_RPC_USERNAME:-}
      MONERO_DAEMON_RPC_PASSWORD: ${MONERO_DAEMON_RPC_PASSWORD:-}
    command: >-
      --wallet-dir wallet
      --rpc-bind-ip=0.0.0.0
      --confirm-external-bind
      --rpc-bind-port=28081
      --daemon-host=${MONERO_DAEMON_RPC_HOSTNAME}
      --daemon-port=${MONERO_DAEMON_RPC_PORT}
    volumes:
      - ./moneropay/data/wallet:/home/monero/wallet
    depends_on:
      change-vol-ownership:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --digest -u \"$${MONERO_WALLET_RPC_USERNAME}:$${MONERO_WALLET_RPC_PASSWORD}\" localhost:28081/json_rpc -d '{\"jsonrpc\":\"2.0\",\"id\":\"0\",\"method\":\"get_version\"}'"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ------------------------
  # MoneroPay database
  # ------------------------
  moneropay-postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${MONEROPAY_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${MONEROPAY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${MONEROPAY_POSTGRES_DATABASE}
    volumes:
      - ./moneropay/data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MONEROPAY_POSTGRES_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ------------------------
  # MoneroPay
  # ------------------------
  moneropay:
    image: registry.gitlab.com/moneropay/moneropay:v2.8.1@sha256:e480b174755c3a2c33ba11cbad628ed9f7e6935c3081f954fc9b5e7d7c21ddd2
    environment:
      RPC_ADDRESS: http://monero-wallet-rpc:28081/json_rpc
      RPC_USERNAME: ${MONERO_WALLET_RPC_USERNAME}
      RPC_PASSWORD: ${MONERO_WALLET_RPC_PASSWORD}
      POSTGRESQL: postgresql://${MONEROPAY_POSTGRES_USERNAME}:${MONEROPAY_POSTGRES_PASSWORD}@moneropay-postgresql:5432/${MONEROPAY_POSTGRES_DATABASE}?sslmode=disable
      POLL_FREQUENCY: 2s
      ZERO_CONF: "true"
    depends_on:
      monero-wallet-rpc:
        condition: service_healthy
      moneropay-postgresql:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONEROPAY_PORT}:5000"

  # ------------------------
  # Backend database
  # ------------------------
  backend-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${BACKEND_DB_PORT}:5432"
    volumes:
      - backend_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------
  # Backend API
  # ------------------------
  backend:
    image: ghcr.io/monero-merchant/monero-merchant-backend:${MONERO_MERCHANT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      backend-db:
        condition: service_healthy
      moneropay:
        condition: service_started
    environment:
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PORT: "8080"

      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}

      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_MONEROPAY_SECRET: ${JWT_MONEROPAY_SECRET}
      JWT_LWS_TOKEN: ${JWT_LWS_TOKEN:-}

      MONEROPAY_BASE_URL: ${MONEROPAY_BASE_URL}
      MONEROPAY_CALLBACK_URL: ${MONEROPAY_CALLBACK_URL}

      MONERO_DAEMON_RPC_ENDPOINT: ${MONERO_DAEMON_RPC_ENDPOINT}
      MONERO_DAEMON_RPC_USERNAME: ${MONERO_DAEMON_RPC_USERNAME:-}
      MONERO_DAEMON_RPC_PASSWORD: ${MONERO_DAEMON_RPC_PASSWORD:-}
      MONERO_WALLET_RPC_ENDPOINT: ${MONERO_WALLET_RPC_ENDPOINT}
      MONERO_WALLET_RPC_USERNAME: ${MONERO_WALLET_RPC_USERNAME}
      MONERO_WALLET_RPC_PASSWORD: ${MONERO_WALLET_RPC_PASSWORD}

      # The wallet MoneroPay creates on first start
      WALLET_NAME: wallet
      WALLET_PASSWORD: ""
      WALLET_AUTO_REFRESH_PERIOD: ${WALLET_AUTO_REFRESH_PERIOD}

      # Set by the gateway
      TRUSTED_PROXY_HEADER: X-Real-IP
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ------------------------
  # Frontend
  # ------------------------
  frontend:
    image: ghcr.io/monero-merchant/monero-merchant-frontend:${MONERO_MERCHANT_VERSION:-latest}
    restart: unless-stopped

  # ------------------------
  # Gateway
  # ------------------------
  gateway:
    image: ghcr.io/monero-merchant/monero-merchant-gateway:${MONERO_MERCHANT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - gateway_data:/data
      - gateway_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

volumes:
  backend_db:
  gateway_data:
  gateway_config: